document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html lang=\"en\"><head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>TAMARIS // LEVEL 5</title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin=\"\">\n<style>/* cyrillic-ext */\n@font-face {\n  font-family: 'Press Start 2P';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"c9fdb3d5-42b5-4534-af00-c9b4ffdb1472\") format('woff2');\n  unicode-range: U+0460-052F, U+1C80-1C8A, U+20B4, U+2DE0-2DFF, U+A640-A69F, U+FE2E-FE2F;\n}\n/* cyrillic */\n@font-face {\n  font-family: 'Press Start 2P';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"08c3eec5-0093-4744-87b5-fd52dc66c58b\") format('woff2');\n  unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;\n}\n/* greek */\n@font-face {\n  font-family: 'Press Start 2P';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"7f6df451-c649-4c7b-ac01-cd5209d54882\") format('woff2');\n  unicode-range: U+0370-0377, U+037A-037F, U+0384-038A, U+038C, U+038E-03A1, U+03A3-03FF;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Press Start 2P';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"fbfa22ad-569b-4873-934c-eca1da21cd3e\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Press Start 2P';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"998d0dd4-da0c-455c-bfe0-cc50df1985fc\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n</style>\n<style>\n  :root{\n    /* féérique pixel palette */\n    --ink:#1b0f33;\n    --fg:#bdf6e3;          /* digit colour, shifts with urgency */\n    --glow:#7fe9ff;        /* aura colour, shifts with urgency */\n    --fg-dim:color-mix(in srgb, var(--fg) 11%, transparent);\n    --cell: clamp(7px, 4.2vw, 15px);\n    --scan: clamp(2px, 0.55vw, 3px);\n  }\n\n  *{ box-sizing:border-box; margin:0; padding:0; }\n  html,body{ height:100%; }\n\n  body{\n    background:\n      radial-gradient(ellipse 130% 100% at 50% 18%, #4a2a7e 0%, #2c1758 38%, #1a0d3a 70%, #120829 100%);\n    color:var(--fg);\n    font-family:'Press Start 2P', monospace;\n    display:flex; align-items:center; justify-content:center;\n    min-height:100vh; overflow:hidden;\n    padding:clamp(10px,3vw,34px);\n    -webkit-font-smoothing:none; image-rendering:pixelated;\n    cursor:default; user-select:none;\n  }\n\n  /* ---------- CRT cabinet ---------- */\n  .cabinet{ position:relative; width:min(990px, 100%); filter:brightness(1); }\n\n  .screen{\n    position:relative;\n    background:\n      radial-gradient(ellipse 130% 120% at 50% 42%, #241048 0%, #1a0c38 60%, #140828 100%);\n    border:var(--cell) solid #261447;\n    border-radius:18px;\n    box-shadow:\n      0 0 0 2px #0c0620,\n      0 0 0 5px #38205f,\n      0 0 70px rgba(127,233,255,0.10),\n      inset 0 0 90px rgba(0,0,0,0.85),\n      inset 0 0 34px rgba(189,246,227,0.05);\n    padding:clamp(16px,3vw,28px) clamp(16px,3.2vw,32px);\n    overflow:hidden;\n  }\n  .screen::before{\n    content:\"\"; position:absolute; inset:0; z-index:7; pointer-events:none;\n    background:radial-gradient(ellipse 80% 55% at 50% 0%, rgba(255,255,255,0.05), transparent 60%);\n  }\n\n  /* scanlines + vignette */\n  .scanlines{\n    position:absolute; inset:0; z-index:6; pointer-events:none;\n    background:repeating-linear-gradient(to bottom,\n      rgba(0,0,0,0) 0, rgba(0,0,0,0) calc(var(--scan) - 1px), rgba(10,4,26,0.30) var(--scan));\n    mix-blend-mode:multiply;\n    animation:roll 9s linear infinite;\n  }\n  @keyframes roll{ from{ background-position:0 0; } to{ background-position:0 120px; } }\n  .vignette{\n    position:absolute; inset:0; z-index:5; pointer-events:none;\n    background:radial-gradient(ellipse 100% 100% at 50% 50%, transparent 56%, rgba(8,3,22,0.5) 100%);\n    animation:flicker 7s steps(60) infinite;\n  }\n  @keyframes flicker{ 0%,100%,47%,49%,71%,73%{ opacity:1; } 48%{ opacity:0.9; } 72%{ opacity:0.94; } }\n\n  /* ---------- rainbow backdrop ---------- */\n  .rainbow{\n    position:absolute; left:50%; top:53%;\n    width:min(660px, 94%);\n    transform:translate(-50%,-50%);\n    z-index:1; pointer-events:none;\n    image-rendering:pixelated;\n    filter:drop-shadow(0 0 24px rgba(180,120,255,0.35)) saturate(1.05);\n    animation:floaty 7s ease-in-out infinite;\n  }\n  @keyframes floaty{ 0%,100%{ transform:translate(-50%,-50%); } 50%{ transform:translate(-50%,calc(-50% - 8px)); } }\n\n  /* sparkle layer */\n  .sparkles{ position:absolute; inset:0; z-index:2; pointer-events:none; }\n  .spark{ position:absolute; display:grid; grid-template-columns:repeat(5,var(--sp)); --sp:3px; opacity:0; }\n  .spark i{ width:var(--sp); height:var(--sp); }\n  .spark i.on{ background:var(--sc); box-shadow:0 0 5px var(--sc); }\n  @keyframes twinkle{ 0%,100%{ opacity:0; transform:scale(0.6); } 50%{ opacity:1; transform:scale(1); } }\n\n  .stack{ position:relative; z-index:3; display:flex; flex-direction:column; gap:clamp(14px,2.6vw,26px); min-height:clamp(460px,76vh,720px); }\n\n  /* ---------- top HUD ---------- */\n  .hud{\n    display:flex; justify-content:space-between; align-items:flex-start;\n    font-size:clamp(6px,1.5vw,10px); letter-spacing:1px; line-height:1.7;\n    color:color-mix(in srgb, var(--fg) 72%, #000);\n  }\n  .hud .right{ text-align:right; }\n  .hud b{ color:var(--fg); text-shadow:0 0 8px var(--glow); }\n  .brand-name{ color:#ff6ad5; text-shadow:0 0 8px #ff6ad5; }\n  .brand-level{ color:#7fe9ff; text-shadow:0 0 8px #7fe9ff; }\n  .dot{\n    display:inline-block; width:0.8em; height:0.8em; margin-right:0.55em; vertical-align:-1px;\n    background:var(--glow); box-shadow:0 0 9px var(--glow);\n    animation:beacon 1.4s steps(2) infinite;\n  }\n  @keyframes beacon{ 0%,55%{ opacity:1; } 56%,100%{ opacity:0.2; } }\n\n  /* ---------- readout ---------- */\n  .readout{\n    position:relative; flex:1;\n    display:flex; flex-direction:column; align-items:center; justify-content:center;\n    gap:clamp(10px,2vw,18px);\n  }\n  /* soft scrim so digits stay legible over the rainbow */\n  .readout::before{\n    content:\"\"; position:absolute; left:50%; top:54%; transform:translate(-50%,-50%);\n    width:118%; height:62%;\n    background:radial-gradient(ellipse 60% 60% at 50% 50%, rgba(18,8,40,0.78) 0%, rgba(18,8,40,0.35) 55%, transparent 78%);\n    z-index:-1; pointer-events:none;\n  }\n  .tminus{\n    font-size:clamp(8px,1.8vw,12px);\n    letter-spacing:clamp(4px,1.3vw,9px); text-indent:clamp(4px,1.3vw,9px);\n    color:color-mix(in srgb, var(--fg) 82%, #000);\n    text-shadow:0 0 10px var(--glow);\n  }\n\n  .display-fit{ width:100%; display:flex; justify-content:center; }\n  .display{\n    display:flex; align-items:flex-start; gap:var(--cell);\n    transform-origin:center center;\n    filter:drop-shadow(0 0 12px color-mix(in srgb, var(--glow) 60%, transparent));\n  }\n  .group{ display:flex; flex-direction:column; align-items:center; gap:calc(var(--cell)*0.7); }\n  .pair{ display:flex; gap:calc(var(--cell)*0.6); }\n  .glabel{ font-size:clamp(5px,1.1vw,8px); letter-spacing:1px; color:color-mix(in srgb, var(--fg) 60%, #000); }\n\n  .digit{ display:grid; grid-template-columns:repeat(5,var(--cell)); grid-template-rows:repeat(7,var(--cell)); gap:1px; }\n  .digit i{ width:var(--cell); height:var(--cell); background:var(--fg-dim); }\n  .digit i.on{ background:var(--fg); box-shadow:0 0 7px var(--glow), 0 0 2px var(--fg); }\n\n  .colon{ display:grid; grid-template-rows:repeat(7,var(--cell)); gap:1px; }\n  .colon i{ width:var(--cell); height:var(--cell); background:transparent; }\n  .colon i.on{ background:var(--fg); box-shadow:0 0 7px var(--glow); }\n  .colon.blink i.on{ animation:cblink 1s steps(2) infinite; }\n  @keyframes cblink{ 0%,49%{ opacity:1; } 50%,100%{ opacity:0.12; } }\n\n  .status{\n    font-size:clamp(7px,1.6vw,11px); letter-spacing:2px; text-align:center;\n    color:var(--fg); text-shadow:0 0 12px var(--glow); min-height:1.2em;\n  }\n  .status.alarm{ animation:sblink 0.5s steps(2) infinite; }\n  @keyframes sblink{ 0%,49%{ opacity:1; } 50%,100%{ opacity:0.3; } }\n\n  /* ---------- control deck ---------- */\n  .deck{ display:flex; gap:clamp(8px,1.6vw,14px); justify-content:center; flex-wrap:wrap; }\n  button{\n    font-family:inherit; font-size:clamp(6px,1.5vw,10px); letter-spacing:1px;\n    color:var(--fg); background:rgba(20,10,42,0.85);\n    border:2px solid color-mix(in srgb, var(--glow) 50%, #1a0d3a);\n    padding:clamp(8px,1.6vw,12px) clamp(10px,2vw,18px); cursor:pointer; text-transform:uppercase;\n    box-shadow:0 3px 0 #0c0620, inset 0 0 0 1px rgba(0,0,0,0.35);\n  }\n  button:hover{ background:var(--glow); color:#160a2e; text-shadow:none; box-shadow:0 3px 0 #0c0620, 0 0 16px var(--glow); }\n  button:active{ transform:translateY(2px); box-shadow:0 1px 0 #0c0620; }\n  button.primary{ border-color:var(--glow); box-shadow:0 3px 0 #0c0620, 0 0 16px color-mix(in srgb,var(--glow) 45%, transparent); }\n\n  /* ---------- modal ---------- */\n  .backdrop{\n    position:fixed; inset:0; z-index:50; display:flex; align-items:center; justify-content:center;\n    background:rgba(8,4,22,0.72); padding:24px;\n    animation:fade 0.18s ease-out;\n  }\n  .backdrop[hidden]{ display:none; }\n  @keyframes fade{ from{ opacity:0; } to{ opacity:1; } }\n  .modal{\n    width:min(420px, 100%);\n    background:radial-gradient(ellipse 120% 120% at 50% 0%, #2a1556 0%, #1c0e3c 100%);\n    border:3px solid color-mix(in srgb, var(--glow) 55%, #1a0d3a);\n    box-shadow:0 0 0 2px #0c0620, 0 0 40px rgba(127,233,255,0.18), 0 16px 0 #0c0620;\n    padding:clamp(20px,4vw,30px); display:flex; flex-direction:column; gap:clamp(14px,2.4vw,20px);\n  }\n  .mtitle{ font-size:clamp(9px,2vw,13px); text-align:center; color:var(--fg); text-shadow:0 0 12px var(--glow); letter-spacing:2px; }\n  .mfield{ display:flex; flex-direction:column; gap:9px; }\n  .mlabel{ font-size:clamp(6px,1.4vw,9px); letter-spacing:1px; color:color-mix(in srgb, var(--fg) 68%, #000); }\n  .modal input{\n    font-family:inherit; font-size:clamp(8px,1.8vw,12px); color:var(--fg);\n    background:#0f0726; border:2px solid color-mix(in srgb, var(--glow) 40%, #1a0d3a);\n    padding:11px 12px; letter-spacing:1px;\n    color-scheme:dark;\n  }\n  .modal input:focus{ outline:none; border-color:var(--glow); box-shadow:0 0 12px color-mix(in srgb,var(--glow) 40%, transparent); }\n  .mrow{ display:flex; gap:10px; justify-content:flex-end; margin-top:4px; }\n  .mhint{ font-size:clamp(5px,1.2vw,8px); line-height:1.7; color:color-mix(in srgb, var(--fg) 55%, #000); text-align:center; }\n\n  @media (prefers-reduced-motion: reduce){\n    .scanlines,.vignette,.dot,.colon.blink i.on,.status.alarm,.rainbow,.spark{ animation:none !important; }\n    .spark{ opacity:0.85 !important; }\n  }\n</style>\n</head>\n<body>\n  \n\n  <main class=\"cabinet\" id=\"cabinet\">\n    <div class=\"screen\">\n      <img class=\"rainbow\" id=\"rainbow\" src=\"345c8939-70b9-4682-a8c1-bf9e065d9787\" alt=\"\">\n      <div class=\"sparkles\" id=\"sparkles\"></div>\n\n      <div class=\"stack\">\n        <div class=\"hud\">\n          <div class=\"left\"><span class=\"dot\"></span><span class=\"brand-name\">TAMARIS</span> <span class=\"brand-level\">LEVEL 5</span></div>\n          <div class=\"right\">TARGET<br><b id=\"targetLabel\">— — —</b></div>\n        </div>\n\n        <div class=\"readout\">\n          <div class=\"tminus\">T - M I N U S</div>\n          <div class=\"display-fit\"><div class=\"display\" id=\"display\"></div></div>\n          <div class=\"status\" id=\"status\">SET YOUR TARGET</div>\n        </div>\n\n        <div class=\"deck\">\n          <button class=\"primary\" id=\"editBtn\">◇ EDIT TARGET</button>\n          <button id=\"soundBtn\">SOUND: ON</button>\n          <button id=\"shareBtn\">SHARE</button>\n        </div>\n      </div>\n\n      <div class=\"scanlines\"></div>\n      <div class=\"vignette\"></div>\n    </div>\n  </main>\n\n  <!-- edit modal -->\n  <div class=\"backdrop\" id=\"backdrop\" hidden=\"\">\n    <div class=\"modal\" role=\"dialog\" aria-modal=\"true\">\n      <div class=\"mtitle\">◇ SET TARGET ◇</div>\n      <div class=\"mfield\">\n        <label class=\"mlabel\" for=\"dateIn\">DATE</label>\n        <input type=\"date\" id=\"dateIn\">\n      </div>\n      <div class=\"mfield\">\n        <label class=\"mlabel\" for=\"timeIn\">TIME</label>\n        <input type=\"time\" id=\"timeIn\">\n      </div>\n      <div class=\"mrow\">\n        <button id=\"modalCancel\">CANCEL</button>\n        <button class=\"primary\" id=\"modalSet\">SET</button>\n      </div>\n      <div class=\"mhint\" id=\"mhint\">choose the moment the magic happens</div>\n    </div>\n  </div>\n\n<script>\n(function(){\n  \"use strict\";\n\n  /* ---------- 5x7 LED font ---------- */\n  const FONT = {\n    '0':[\"01110\",\"10001\",\"10011\",\"10101\",\"11001\",\"10001\",\"01110\"],\n    '1':[\"00100\",\"01100\",\"00100\",\"00100\",\"00100\",\"00100\",\"01110\"],\n    '2':[\"01110\",\"10001\",\"00001\",\"00010\",\"00100\",\"01000\",\"11111\"],\n    '3':[\"11110\",\"00001\",\"00001\",\"01110\",\"00001\",\"00001\",\"11110\"],\n    '4':[\"00010\",\"00110\",\"01010\",\"10010\",\"11111\",\"00010\",\"00010\"],\n    '5':[\"11111\",\"10000\",\"11110\",\"00001\",\"00001\",\"10001\",\"01110\"],\n    '6':[\"00110\",\"01000\",\"10000\",\"11110\",\"10001\",\"10001\",\"01110\"],\n    '7':[\"11111\",\"00001\",\"00010\",\"00100\",\"01000\",\"01000\",\"01000\"],\n    '8':[\"01110\",\"10001\",\"10001\",\"01110\",\"10001\",\"10001\",\"01110\"],\n    '9':[\"01110\",\"10001\",\"10001\",\"01111\",\"00001\",\"00010\",\"01100\"]\n  };\n\n  /* ---------- sparkles ---------- */\n  const PLUS = [\"00100\",\"00100\",\"11111\",\"00100\",\"00100\"];\n  const SPARK_COLORS = ['#ffe14d','#ff6ad5','#7fe9ff','#9b5cff','#39d98a','#ff8a3d'];\n  const sparkLayer = document.getElementById('sparkles');\n  function makeSpark(){\n    const el = document.createElement('div');\n    el.className = 'spark';\n    const c = SPARK_COLORS[Math.floor(Math.random()*SPARK_COLORS.length)];\n    el.style.setProperty('--sc', c);\n    const sp = (2 + Math.random()*2.4).toFixed(1)+'px';\n    el.style.setProperty('--sp', sp);\n    PLUS.forEach(r=>{ for(const ch of r){ const i=document.createElement('i'); if(ch==='1') i.className='on'; el.appendChild(i); } });\n    el.style.left = (5 + Math.random()*90)+'%';\n    el.style.top  = (6 + Math.random()*88)+'%';\n    const dur = (1.8 + Math.random()*2.6).toFixed(2);\n    el.style.animation = `twinkle ${dur}s ease-in-out ${(Math.random()*3).toFixed(2)}s infinite`;\n    return el;\n  }\n  let sparkCount = 0;\n  function setSparks(n){\n    n = Math.max(0, Math.min(40, n));\n    while(sparkCount < n){ sparkLayer.appendChild(makeSpark()); sparkCount++; }\n    while(sparkCount > n){ sparkLayer.lastChild && sparkLayer.removeChild(sparkLayer.lastChild); sparkCount--; }\n  }\n  setSparks(14);\n\n  /* ---------- flexible pixel display ---------- */\n  const display = document.getElementById('display');\n  let layoutKey = '';\n  let cells = [];   // current digit updaters in order\n  let colonEls = [];\n\n  function makeDigit(){\n    const d = document.createElement('div'); d.className='digit';\n    const arr=[]; for(let i=0;i<35;i++){ const c=document.createElement('i'); d.appendChild(c); arr.push(c); }\n    return { el:d, set(ch){ const p=FONT[ch]||FONT['0']; for(let r=0;r<7;r++)for(let c=0;c<5;c++){ arr[r*5+c].className = p[r][c]==='1'?'on':''; } } };\n  }\n  function makeColon(){\n    const c=document.createElement('div'); c.className='colon blink';\n    const on=[2,4]; for(let r=0;r<7;r++){ const i=document.createElement('i'); if(on.includes(r)) i.className='on'; c.appendChild(i); }\n    return c;\n  }\n  // build display structure for given groups [{v:\"00\",l:\"DAYS\"}...]\n  function buildLayout(groups){\n    display.innerHTML=''; cells=[]; colonEls=[];\n    groups.forEach((g,gi)=>{\n      const col=document.createElement('div'); col.className='group';\n      const pair=document.createElement('div'); pair.className='pair';\n      const d0=makeDigit(), d1=makeDigit();\n      pair.append(d0.el,d1.el); col.appendChild(pair);\n      const lab=document.createElement('div'); lab.className='glabel'; lab.textContent=g.l; col.appendChild(lab);\n      display.appendChild(col);\n      cells.push(d0,d1);\n      if(gi<groups.length-1){ const cl=makeColon(); colonEls.push(cl); display.appendChild(cl); }\n    });\n  }\n  function setColonBlink(on){ colonEls.forEach(c=> c.classList.toggle('blink', on)); }\n\n  function fitDisplay(){\n    display.style.transform='scale(1)';\n    const avail = display.parentElement.clientWidth;\n    const w = display.scrollWidth;\n    if(w>0){ const s=Math.min(1,(avail-6)/w); display.style.transform=`scale(${s})`; }\n  }\n\n  /* ---------- state ---------- */\n  const LS = {\n    get(k,def){ try{ const v=localStorage.getItem(k); return v===null?def:JSON.parse(v); }catch(e){ return def; } },\n    set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }\n  };\n  function targetFromUrl(){\n    try{\n      const p=new URLSearchParams(location.search);\n      const raw=p.get('t')||p.get('target');\n      if(!raw) return null;\n      const n=Number(raw);\n      if(Number.isFinite(n) && n>0) return n<1000000000000?n*1000:n;\n      const d=new Date(raw);\n      return Number.isNaN(d.getTime())?null:d.getTime();\n    }catch(e){ return null; }\n  }\n  function shareUrl(){\n    const u=new URL(location.href);\n    if(target==null) u.searchParams.delete('t');\n    else u.searchParams.set('t', new Date(target).toISOString());\n    return u.toString();\n  }\n  function syncUrl(){\n    if(target==null) return;\n    try{ history.replaceState(null, '', shareUrl()); }catch(e){}\n  }\n  let target = targetFromUrl() ?? LS.get('tam_target', null);   // epoch ms or null\n  let muted  = LS.get('tam_muted', false);\n\n  /* ---------- audio (gentle chimes) ---------- */\n  let actx=null;\n  function ensureAudio(){\n    if(!actx){ try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ actx=null; } }\n    if(actx && actx.state==='suspended') actx.resume();\n  }\n  function chime(freq,dur,type,vol){\n    if(muted||!actx) return;\n    const t=actx.currentTime, o=actx.createOscillator(), g=actx.createGain();\n    o.type=type||'triangle'; o.frequency.setValueAtTime(freq,t);\n    g.gain.setValueAtTime(0.0001,t);\n    g.gain.exponentialRampToValueAtTime(vol||0.12,t+0.01);\n    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);\n    o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+dur+0.03);\n  }\n  function tickSound(secLeft, urg){\n    if(urg==='final'){ chime(880,0.16,'triangle',0.13); setTimeout(()=>chime(1320,0.14,'sine',0.10),60); }\n    else if(urg==='soon'){ chime(660,0.12,'triangle',0.09); }\n    else if(urg==='near'){ chime(523,0.10,'sine',0.06); }\n    else { chime(440,0.07,'sine',0.04); }\n  }\n  function arriveSound(){\n    if(muted||!actx) return;\n    [523,659,784,1047,1319].forEach((f,i)=> setTimeout(()=>chime(f,0.4,'triangle',0.12), i*120));\n  }\n  // unlock audio on first interaction\n  function unlock(){ ensureAudio(); window.removeEventListener('pointerdown',unlock); window.removeEventListener('keydown',unlock); }\n  window.addEventListener('pointerdown',unlock); window.addEventListener('keydown',unlock);\n\n  /* ---------- urgency / colours ---------- */\n  const root=document.documentElement;\n  const statusEl=document.getElementById('status');\n  const targetLabel=document.getElementById('targetLabel');\n  const STATES={\n    calm : { fg:'#bdf6e3', glow:'#7fe9ff', msg:'THE STARS ARE ALIGNING' },\n    near : { fg:'#d9bcff', glow:'#a87bff', msg:'ALMOST THERE' },\n    soon : { fg:'#ffe6a3', glow:'#ffc24d', msg:'GATHERING MAGIC' },\n    final: { fg:'#ffb3e6', glow:'#ff6ad5', msg:'MAKE A WISH...' },\n    arrived:{fg:'#fff3c4', glow:'#ffd84d', msg:'✦ IT IS TIME ✦' },\n    none : { fg:'#a9c6ff', glow:'#7f9bff', msg:'SET YOUR TARGET' }\n  };\n  function applyState(key, alarm){\n    const s=STATES[key];\n    root.style.setProperty('--fg', s.fg);\n    root.style.setProperty('--glow', s.glow);\n    statusEl.textContent=s.msg;\n    statusEl.classList.toggle('alarm', !!alarm);\n  }\n\n  const MONTHS=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];\n  function fmtTarget(ts){\n    if(ts==null) return '— — —';\n    const d=new Date(ts);\n    const dd=String(d.getDate()).padStart(2,'0');\n    const hh=String(d.getHours()).padStart(2,'0');\n    const mm=String(d.getMinutes()).padStart(2,'0');\n    return `${dd} ${MONTHS[d.getMonth()]} ${d.getFullYear()} · ${hh}:${mm}`;\n  }\n\n  /* ---------- render ---------- */\n  let lastSecond=-1, lastUrg='';\n  function urgencyFor(sec){\n    if(sec<=60) return 'final';\n    if(sec<=3600) return 'soon';\n    if(sec<=86400) return 'near';\n    return 'calm';\n  }\n  function pad(n){ return String(n).padStart(2,'0'); }\n\n  function render(){\n    targetLabel.textContent = fmtTarget(target);\n\n    if(target==null){\n      ensureLayout([{v:'00',l:'HRS'},{v:'00',l:'MIN'},{v:'00',l:'SEC'}]);\n      writeGroups(['00','00','00']);\n      setColonBlink(false);\n      applyState('none', false);\n      setSparks(10);\n      fitDisplay();\n      return;\n    }\n\n    let ms = target - Date.now();\n    if(ms<=0){\n      ensureLayout([{v:'00',l:'HRS'},{v:'00',l:'MIN'},{v:'00',l:'SEC'}]);\n      writeGroups(['00','00','00']);\n      setColonBlink(false);\n      applyState('arrived', true);\n      setSparks(34);\n      if(lastUrg!=='arrived'){ lastUrg='arrived'; arriveSound(); }\n      fitDisplay();\n      return;\n    }\n\n    let s=Math.floor(ms/1000);\n    const days=Math.floor(s/86400); s-=days*86400;\n    const hrs=Math.floor(s/3600);  s-=hrs*3600;\n    const mins=Math.floor(s/60);   s-=mins*60;\n    const secs=s;\n    const totalSec=Math.ceil(ms/1000);\n\n    let groups, vals;\n    if(days>0){\n      groups=[{l:'DAYS'},{l:'HRS'},{l:'MIN'},{l:'SEC'}];\n      vals=[pad(Math.min(99,days)),pad(hrs),pad(mins),pad(secs)];\n    } else if(hrs>0){\n      groups=[{l:'HRS'},{l:'MIN'},{l:'SEC'}];\n      vals=[pad(hrs),pad(mins),pad(secs)];\n    } else {\n      groups=[{l:'MIN'},{l:'SEC'}];\n      vals=[pad(mins),pad(secs)];\n    }\n    ensureLayout(groups);\n    writeGroups(vals);\n    setColonBlink(true);\n\n    const urg=urgencyFor(totalSec);\n    applyState(urg, urg==='final');\n    setSparks(urg==='final'?30: urg==='soon'?22: urg==='near'?18:14);\n\n    // gentle per-second chime\n    if(secs!==lastSecond){\n      lastSecond=secs;\n      tickSound(totalSec, urg);\n      LS.set('tam_target', target); // keep persisted\n    }\n    lastUrg=urg;\n    fitDisplay();\n  }\n\n  function ensureLayout(groups){\n    const key=groups.map(g=>g.l).join('-');\n    if(key!==layoutKey){ layoutKey=key; buildLayout(groups); }\n  }\n  function writeGroups(vals){\n    let ci=0;\n    vals.forEach(v=>{ cells[ci++].set(v[0]); cells[ci++].set(v[1]); });\n  }\n\n  /* ---------- loop ---------- */\n  function loop(){ render(); requestAnimationFrame(loop); }\n\n  /* ---------- modal ---------- */\n  const backdrop=document.getElementById('backdrop');\n  const dateIn=document.getElementById('dateIn');\n  const timeIn=document.getElementById('timeIn');\n  const mhint=document.getElementById('mhint');\n  function pad2(n){ return String(n).padStart(2,'0'); }\n  function toDateStr(d){ return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; }\n  function toTimeStr(d){ return `${pad2(d.getHours())}:${pad2(d.getMinutes())}`; }\n\n  function openModal(){\n    const base = target!=null ? new Date(target) : new Date(Date.now()+3600*1000);\n    dateIn.value = toDateStr(base);\n    timeIn.value = toTimeStr(base);\n    mhint.textContent='choose the moment the magic happens';\n    mhint.style.color='';\n    backdrop.hidden=false;\n    setTimeout(()=>dateIn.focus(),30);\n  }\n  function closeModal(){ backdrop.hidden=true; }\n  function confirmModal(){\n    if(!dateIn.value){ mhint.textContent='please pick a date'; mhint.style.color='var(--glow)'; return; }\n    const tm = timeIn.value || '00:00';\n    const dt = new Date(`${dateIn.value}T${tm}`);\n    if(isNaN(dt.getTime())){ mhint.textContent='invalid date / time'; mhint.style.color='var(--glow)'; return; }\n    target = dt.getTime();\n    LS.set('tam_target', target);\n    syncUrl();\n    lastSecond=-1; lastUrg='';\n    ensureAudio();\n    closeModal(); render();\n  }\n\n  document.getElementById('editBtn').addEventListener('click', openModal);\n  document.getElementById('modalCancel').addEventListener('click', closeModal);\n  document.getElementById('modalSet').addEventListener('click', confirmModal);\n  backdrop.addEventListener('click', e=>{ if(e.target===backdrop) closeModal(); });\n  document.addEventListener('keydown', e=>{\n    if(!backdrop.hidden){\n      if(e.key==='Escape') closeModal();\n      else if(e.key==='Enter') confirmModal();\n    } else if(e.key==='e'||e.key==='E'){ openModal(); }\n  });\n\n  /* ---------- sound toggle ---------- */\n  const soundBtn=document.getElementById('soundBtn');\n  const shareBtn=document.getElementById('shareBtn');\n  soundBtn.textContent='SOUND: '+(muted?'OFF':'ON');\n  soundBtn.addEventListener('click', ()=>{ muted=!muted; if(!muted) ensureAudio(); soundBtn.textContent='SOUND: '+(muted?'OFF':'ON'); LS.set('tam_muted',muted); });\n  shareBtn.addEventListener('click', async ()=>{\n    syncUrl();\n    const url=shareUrl();\n    const old=shareBtn.textContent;\n    try{\n      if(navigator.share && location.protocol!=='file:') await navigator.share({title:'TAMARIS LEVEL 5 countdown', url});\n      else if(navigator.clipboard) await navigator.clipboard.writeText(url);\n      shareBtn.textContent='LINK COPIED';\n    }catch(e){ shareBtn.textContent='COPY URL'; }\n    setTimeout(()=>{ shareBtn.textContent=old; },1400);\n  });\n\n  /* ---------- boot ---------- */\n  window.addEventListener('resize', fitDisplay);\n  syncUrl();\n  render();\n  requestAnimationFrame(loop);\n})();\n<\/script>\n\n\n</body></html>"
